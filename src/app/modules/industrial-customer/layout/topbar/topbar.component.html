<header class="topbar-container">
  
  <!-- Left: Official Brand Logo -->
  <div class="brand-section">
    <img src="assets/images/torrent_text.png" alt="Torrent Gas Text" class="logo-text" />
  </div>

  <!-- Right: Global Data & User Profile -->
  <div class="topbar-actions">
    
    <!-- Always Visible Customer ID -->
    <div class="customer-id-badge">
      <i class="ri-fingerprint-line"></i>
      <div class="badge-content">
        <span class="badge-label">Customer ID</span>
        <span class="badge-value">{{ customerId }}</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- User Profile Dropdown Area -->
    <div class="user-profile-trigger">
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">Industrial Consumer</span>
      </div>
      <div class="avatar">{{ currentUser.avatar }}</div>
      <i class="ri-arrow-down-s-line chevron"></i>
    </div>
    
  </div>
</header>
